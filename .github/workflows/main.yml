name: Hintatutka Automaatio & Android APK

on:
  schedule:
    - cron: '30 6 * * *' # Päivittäinen hintahaku klo 08:30 Suomen aikaa
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'package.json'
  workflow_dispatch: # Mahdollistaa manuaalisen ajon koska tahansa

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hae päivän hinnat ja tarkista hälytykset
        run: python fetch_prices.py
      - name: Tallenna prices.json
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Hintatutka Bot"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Päivitä hinnat" && git push)

  build-android-apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Asenna Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Alusta Capacitor ja Android-projekti
        run: |
          npm install
          npx cap init "Hintatutka" "fi.hintatutka.app" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Käännä Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: Hintatutka-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
